<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#cableBg)" />
  <rect x="24" y="24" width="752" height="752" rx="24" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Cable Reel Icon -->
  <g transform="translate(280, 200)" filter="url(#shadow)">
    <!-- Reel Top Rim -->
    <ellipse cx="120" cy="50" rx="110" ry="32" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3" />
    <!-- Reel Body (wound cable) -->
    <path d="M10 50 V180 C10 210, 230 210, 230 180 V50 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="3" />
    <!-- Cable Texture Lines -->
    <path d="M10 90 C10 120, 230 120, 230 90" stroke="#94A3B8" stroke-width="2" fill="none" />
    <path d="M10 130 C10 160, 230 160, 230 130" stroke="#94A3B8" stroke-width="2" fill="none" />
    <!-- Reel Bottom Rim -->
    <ellipse cx="120" cy="180" rx="110" ry="32" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3" />
    <!-- Center Hole -->
    <ellipse cx="120" cy="50" rx="36" ry="12" fill="#64748B" />
    <ellipse cx="120" cy="50" rx="20" ry="7" fill="#334155" />
    <!-- Cable End -->
    <path d="M210 160 Q260 180 270 230" stroke="#B5121B" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Labels -->
  <text x="400" y="550" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#292F36">
    Official Cable Reel Photo Pending
  </text>
  
  <text x="400" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B">
    Part number, conductor gauge, and reel packaging verified
  </text>

  <!-- ZEZ Verification Badge -->
  <g transform="translate(285, 615)">
    <rect width="230" height="34" rx="17" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
    <circle cx="22" cy="17" r="5" fill="#B5121B" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991B1B">
      ZEZ AUTOMATION CATALOG
    </text>
  </g>
</svg>
